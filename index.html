<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Chat avec Olama</title>
    <style>
        body { font-family: Arial; margin: 2rem; }
        #response { margin-top: 1rem; padding: 1rem; border: 1px solid #ccc; min-height: 50px; }
    </style>
</head>
<body>
    <h1>Chat avec Olama</h1>
    <input type="text" id="message" placeholder="Écris ton message..." size="50">
    <button onclick="sendMessage()">Envoyer</button>
    <div id="response"></div>

    <script>
        async function sendMessage() {
            const message = document.getElementById("message").value;
            const responseDiv = document.getElementById("response");
            responseDiv.innerHTML = "En cours...";

            try {
                const res = await fetch(`https://ia2-u7l2.onrender.com/chat?message=${encodeURIComponent(message)}`);
                if (!res.ok) throw new Error("Erreur serveur");
                const data = await res.json();
                responseDiv.innerHTML = data.response;
            } catch (err) {
                responseDiv.innerHTML = "Erreur : impossible de contacter le serveur.";
            }
        }
    </script>
</body>
</html>
