<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Chat avec Ollama</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        #chatbox { width: 100%; max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        #messages { height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; }
        .message { margin-bottom: 10px; }
        .user { font-weight: bold; color: #333; }
        .ai { font-weight: bold; color: #007bff; }
        input[type=text] { width: calc(100% - 100px); padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 10px 15px; border-radius: 5px; border: none; background: #007bff; color: #fff; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div id="chatbox">
        <h2>Chat avec Ollama</h2>
        <div id="messages"></div>
        <input type="text" id="userInput" placeholder="Écris ton message ici...">
        <button onclick="sendMessage()">Envoyer</button>
    </div>

    <script>
        const serverURL = "https://ia2.onrender.com/chat"; // Mets ici ton URL Render

        function appendMessage(sender, text) {
            const messagesDiv = document.getElementById("messages");
            const messageElem = document.createElement("div");
            messageElem.classList.add("message");
            messageElem.innerHTML = `<span class="${sender}">${sender}:</span> ${text}`;
            messagesDiv.appendChild(messageElem);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const message = input.value.trim();
            if (!message) return;
            appendMessage("user", message);
            input.value = "";

            try {
                const response = await fetch(`${serverURL}?message=${encodeURIComponent(message)}`);
                const data = await response.json();
                appendMessage("ai", data.response);
            } catch (err) {
                appendMessage("ai", "Erreur : impossible de contacter le serveur.");
                console.error(err);
            }
        }

        // Optionnel : envoyer le message avec la touche Entrée
        document.getElementById("userInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
